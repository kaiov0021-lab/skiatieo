<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Aleatória</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3F48CC;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <img id="fotoAleatoria" src="" alt="Imagem Aleatória">

    <script>
        // COLOQUE AQUI O NOME EXATO DE CADA ARQUIVO QUE ESTIVER DENTRO DA PASTA "imagens"
        const imagens = [
            "imagens/foto1.jpg",
            "imagens/foto2.jpg",
            "imagens/foto3.jpg"
        ];

        // Sorteia um número aleatório dentro da lista
        const escolhida = imagens[Math.floor(Math.random() * imagens.length)];

        // Coloca a imagem sorteada na tela
        document.getElementById("fotoAleatoria").src = escolhida;
    </script>

</body>
</html>
