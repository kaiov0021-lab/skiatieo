<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embutir Imagem em HTML</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: #94a3b8;
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  .dropzone {
    border: 2px dashed #475569;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #60a5fa;
    background: #1e2a3f;
  }
  .dropzone p {
    margin: 8px 0 0;
    color: #94a3b8;
    font-size: 0.9rem;
  }
  input[type="file"] { display: none; }
  .preview {
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .preview img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .preview .filename {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #94a3b8;
    word-break: break-all;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #4ade80;
    text-align: center;
    display: none;
  }
  .icon {
    font-size: 2rem;
  }
</style>
</head>
<body>

<div class="card">
  <h1>📦 Embutir imagem em HTML</h1>
  <p class="subtitle">Envie uma imagem e baixe um arquivo HTML único, com a imagem embutida (base64) — sem depender de nenhum outro arquivo.</p>

  <label class="dropzone" id="dropzone" for="fileInput">
    <div class="icon">🖼️</div>
    <p id="dzText">Clique ou arraste uma imagem aqui</p>
  </label>
  <input type="file" id="fileInput" accept="image/*">

  <div class="preview" id="preview">
    <img id="previewImg" src="" alt="Prévia">
    <div class="filename" id="filename"></div>
  </div>

  <button id="downloadBtn">⬇️ Baixar HTML com a imagem embutida</button>
  <div class="status" id="status">✅ HTML baixado com sucesso!</div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const dzText = document.getElementById('dzText');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const filenameEl = document.getElementById('filename');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');

let currentDataUrl = null;
let currentFileName = null;

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    alert('Por favor selecione um arquivo de imagem.');
    return;
  }
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentDataUrl = e.target.result;
    previewImg.src = currentDataUrl;
    filenameEl.textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    preview.style.display = 'block';
    downloadBtn.style.display = 'block';
    statusEl.style.display = 'none';
    dzText.textContent = 'Imagem carregada ✔ — clique para trocar';
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

downloadBtn.addEventListener('click', () => {
  if (!currentDataUrl) return;

  const outputHtml = `<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${currentFileName}</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="${currentDataUrl}" alt="${currentFileName}">
  </div>
</body>
</html>
`;

  const blob = new Blob([outputHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const baseName = currentFileName.replace(/\.[^/.]+$/, '');
  a.download = baseName + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  statusEl.style.display = 'block';
});
</script>

</body>
</html>
