<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Foto Centralizada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3F48CC; /* Cor de fundo */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center; /* Centraliza na horizontal */
            align-items: center;     /* Centraliza na vertical */
            overflow: hidden;
        }
        img {
            max-width: 80%;          /* Impede que a imagem passe da largura da tela */
            max-height: 80%;         /* Impede que a imagem passe da altura da tela */
            border-radius: 8px;      /* Borda levemente arredondada (opcional) */
        }
    </style>
</head>
<body>

    <img src="MACACOOOO.jpg" alt="MACACOOOO">

</body>
</html>
