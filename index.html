<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Aleatório</title>
<style>
  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #f1f1f1;
    --muted: #a0a0c0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .player {
    text-align: center;
    padding: 40px;
    max-width: 90vw;
  }
  .disc {
    width: 220px;
    height: 220px;
    margin: 0 auto 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #222 0 20px, #333 21px 60px, #111 61px 62px, #2a2a2a 63px 100%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 0 6px #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .disc.playing { animation-play-state: running; }
  .disc::after {
    content: "";
    width: 22px;
    height: 22px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 3px #111;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #playBtn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--accent), #c62b47);
    color: white;
    font-size: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    box-shadow: 0 8px 20px rgba(233, 69, 96, 0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #playBtn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 28px rgba(233, 69, 96, 0.7);
  }
  #playBtn:active {
    transform: scale(0.96);
  }
  #playBtn svg {
    width: 34px;
    height: 34px;
    fill: white;
    margin-left: 4px;
  }
  #playBtn.playing svg {
    margin-left: 0;
  }
  .track-title {
    margin-top: 28px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    min-height: 26px;
    word-break: break-word;
  }
  .track-sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .status {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .status.error {
    color: var(--accent);
  }
  .progress-wrap {
    margin-top: 22px;
    width: 280px;
    max-width: 70vw;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    margin-left: auto;
    margin-right: auto;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s linear;
  }
  .count {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="player">
  <div class="disc" id="disc"></div>

  <button id="playBtn" aria-label="Tocar">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <div class="track-title" id="trackTitle">Aperte o play para começar</div>
  <div class="track-sub" id="trackSub"></div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="status" id="status"></div>
  <div class="count" id="count"></div>
</div>

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const disc = document.getElementById('disc');
  const trackTitle = document.getElementById('trackTitle');
  const trackSub = document.getElementById('trackSub');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const progressBar = document.getElementById('progressBar');

  countEl.textContent = TRACKS.length + " músicas na pasta \"" + FOLDER + "\"";

  let lastIndex = -1;
  let isPlaying = false;

  function cleanTitle(filename) {
    let name = filename.replace(/\.mp3$/i, '');
    name = name.replace(/\(MP3_160K\)/gi, '');
    name = name.replace(/_1$/, '');
    return name.trim();
  }

  function pickRandomIndex() {
    if (TRACKS.length <= 1) return 0;
    let idx;
    do {
      idx = Math.floor(Math.random() * TRACKS.length);
    } while (idx === lastIndex);
    return idx;
  }

  function loadAndPlay(index) {
    lastIndex = index;
    const file = TRACKS[index];
    const encodedFolder = FOLDER.split('/').map(encodeURIComponent).join('/');
    const src = encodedFolder + '/' + encodeURIComponent(file);
    audio.src = src;
    statusEl.textContent = '';
    statusEl.classList.remove('error');
    trackTitle.textContent = cleanTitle(file);
    trackSub.textContent = 'Faixa ' + (index + 1) + ' de ' + TRACKS.length;

    audio.play().then(() => {
      setPlayingUI(true);
    }).catch(err => {
      setPlayingUI(false);
      statusEl.classList.add('error');
      statusEl.textContent = 'Não consegui carregar o arquivo. Confira se a pasta "' + FOLDER + '" está ao lado deste HTML e contém "' + file + '".';
    });
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    disc.classList.toggle('playing', playing);
    playBtn.classList.toggle('playing', playing);
    iconPlay.style.display = playing ? 'none' : '';
    iconPause.style.display = playing ? '' : 'none';
    playBtn.setAttribute('aria-label', playing ? 'Pausar' : 'Tocar');
  }

  playBtn.addEventListener('click', () => {
    if (!isPlaying) {
      if (audio.src && !audio.ended && audio.currentTime > 0 && lastIndex !== -1 && audio.paused) {
        // Havia uma pausa manual: tocamos uma música aleatória DIFERENTE, como pedido.
      }
      const idx = pickRandomIndex();
      loadAndPlay(idx);
    } else {
      audio.pause();
      setPlayingUI(false);
    }
  });

  audio.addEventListener('ended', () => {
    const idx = pickRandomIndex();
    loadAndPlay(idx);
  });

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });

  audio.addEventListener('error', () => {
    if (isPlaying) {
      setPlayingUI(false);
      statusEl.classList.add('error');
      statusEl.textContent = 'Erro ao carregar o arquivo de áudio.';
    }
  });
