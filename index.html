<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Aleatória</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3F48CC;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }
        #status {
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="status">Carregando...</div>
    <img id="fotoAleatoria" src="" alt="Imagem Aleatória" style="display:none;">

    <script>
        // ===== ALTERE APENAS ESTAS DUAS LINHAS =====
        const usuario = "kaiov0021-lab";
        const repositorio = "skiatieo";
        // ============================================

        const pasta = "imagens";
        const url = `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

        fetch(url)
            .then(resposta => resposta.json())
            .then(arquivos => {
                // Filtra só arquivos de imagem (ignora outros tipos que possam estar na pasta)
                const extensoes = [".jpg", ".jpeg", ".png", ".gif", ".webp"];
                const imagens = arquivos.filter(arquivo =>
                    extensoes.some(ext => arquivo.name.toLowerCase().endsWith(ext))
                );

                if (imagens.length === 0) {
                    document.getElementById("status").textContent = "Nenhuma imagem encontrada na pasta.";
                    return;
                }

                // Sorteia uma imagem da lista
                const escolhida = imagens[Math.floor(Math.random() * imagens.length)];

                // Mostra a imagem sorteada
                const img = document.getElementById("fotoAleatoria");
                img.src = escolhida.download_url;
                img.style.display = "block";
                document.getElementById("status").style.display = "none";
            })
            .catch(erro => {
                document.getElementById("status").textContent = "Erro ao buscar imagens. Confira o usuário e o repositório no código.";
                console.error(erro);
            });
    </script>

</body>
</html>
